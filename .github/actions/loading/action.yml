---
name: Load Parameters
description: Load parameters for the build job

outputs:
  build_matrix:
    description: Build matrix
    value: ${{ steps.set-matrix.outputs.build_matrix }}
  full_matrix:
    description: Full matrix containing lava details
    value: ${{ steps.set-matrix.outputs.full_matrix }}

runs:
  using: "composite"
  steps:
    - name: Set Build Matrix
      id: set-matrix
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          const pathNested1 = path.join(process.env.GITHUB_WORKSPACE, 'video-driver', 'ci', 'machine.json');
          const pathNested2 = path.join(process.env.GITHUB_WORKSPACE, 'video-driver', 'ci', 'MACHINES.json');
          const pathRoot1 = path.join(process.env.GITHUB_WORKSPACE, 'ci', 'machine.json');
          const pathRoot2 = path.join(process.env.GITHUB_WORKSPACE, 'ci', 'MACHINES.json');

          let targetsPath = '';

          if (fs.existsSync(pathNested1)) {
            console.log(`Found config at nested path: ${pathNested1}`);
            targetsPath = pathNested1;
          } else if (fs.existsSync(pathNested2)) {
            console.log(`Found config at nested path: ${pathNested2}`);
            targetsPath = pathNested2;
          } else if (fs.existsSync(pathRoot1)) {
            console.log(`Found config at root path: ${pathRoot1}`);
            targetsPath = pathRoot1;
          } else if (fs.existsSync(pathRoot2)) {
            console.log(`Found config at root path: ${pathRoot2}`);
            targetsPath = pathRoot2;
          } else {
            console.log('!!! Error: machine.json / MACHINES.json not found in expected locations.');
            console.log(`Checked: ${pathNested1}`);
            console.log(`Checked: ${pathNested2}`);
            console.log(`Checked: ${pathRoot1}`);
            console.log(`Checked: ${pathRoot2}`);

            console.log('--- Workspace Root Contents ---');
            try {
              console.log(fs.readdirSync(process.env.GITHUB_WORKSPACE));
            } catch (e) {
              console.log(e.message);
            }

            core.setFailed('machine.json not found.');
            return;
          }

          let targets;
          try {
            targets = JSON.parse(fs.readFileSync(targetsPath, 'utf-8'));
          } catch (err) {
            core.setFailed(`Failed to parse machine.json: ${err.message}`);
            return;
          }

          const build_matrix = Object.values(targets).map(({
            machine,
            firmware,
            target,
            meta_tar
          }) => ({
            machine,
            firmware,
            target,
            meta_tar
          }));
          core.setOutput('build_matrix', JSON.stringify(build_matrix));

          const full_matrix = Object.values(targets).map(({
            machine,
            firmware,
            target,
            lavaname,
            firmwareid,
            buildid,
            meta_tar
          }) => ({
            machine,
            firmware,
            target,
            lavaname,
            firmwareid,
            buildid,
            meta_tar
          }));
          core.setOutput('full_matrix', JSON.stringify(full_matrix));