name: _test

on:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image
        type: string
        required: true
        default: kmake-image:ver.1.0
      build_matrix:
        description: Build matrix for multi target builds (stringified JSON)
        type: string
        required: true
      full_matrix:
        description: Full matrix containing lava description (stringified JSON)
        type: string
        required: true

jobs:
  test:
    runs-on:
      group: GHA-video-Prd-SelfHosted-RG
      labels: [self-hosted, video-prd-u2204-x64-large-od-ephem]

    strategy:
      fail-fast: false
      matrix:
        build_matrix: ${{ fromJson(inputs.build_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}

      - name: Download URLs list (presigned_urls.json)
        uses: actions/download-artifact@v4
        with:
          name: presigned_urls.json
          merge-multiple: true
          path: ${{ github.workspace }}

      - name: Clone lava job render scripts
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          git clone https://github.com/qualcomm-linux/job_render

      - name: Extract the LAVA machine name
        id: get_lavaname
        uses: actions/github-script@v7
        env:
          FULL_MATRIX: ${{ inputs.full_matrix }}
          CURRENT_MACHINE: ${{ matrix.build_matrix.machine }}
        with:
          script: |
            const fullMatrix = JSON.parse(process.env.FULL_MATRIX);
            const currentMachine = process.env.CURRENT_MACHINE;
            const entry = fullMatrix.find(item => item.machine === currentMachine);

            if (!entry) {
              core.setFailed(`No entry found in full matrix for machine: ${currentMachine}`);
              return;
            }

            const lavaname = entry.lavaname;
            console.log(`Lavaname for ${currentMachine} is ${lavaname}`);
            core.setOutput("LAVANAME", lavaname);

      - name: Create lava job definition
        id: create_job_definition
        uses: qualcomm-linux/video-driver/.github/actions/lava_job_render@video.qclinux.main
        with:
          docker_image: ${{ inputs.docker_image }}
        env:
          FIRMWARE: ${{ matrix.build_matrix.firmware }}
          MACHINE: ${{ matrix.build_matrix.machine }}
          LAVA_NAME: ${{ steps.get_lavaname.outputs.LAVANAME }}

      - name: Submit lava job
        id: submit_job
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          LAVA_OSS_TOKEN: ${{ secrets.LAVA_OSS_TOKEN }}
          LAVA_OSS_USER: ${{ secrets.LAVA_OSS_USER }}
        run: |
          set -euo pipefail
          cd ../job_render

          job_id="$(
            docker run -i --rm \
              --workdir="$PWD" \
              -v "$(dirname "$PWD")":"$(dirname "$PWD")" \
              "$DOCKER_IMAGE" \
              sh -c "lavacli identities add --token \"$LAVA_OSS_TOKEN\" --uri https://lava-oss.qualcomm.com/RPC2 --username \"$LAVA_OSS_USER\" production && lavacli -i production jobs submit ./renders/lava_job_definition.yaml"
          )"

          job_url="https://lava-oss.qualcomm.com/scheduler/job/$job_id"

          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "job_url=$job_url" >> "$GITHUB_OUTPUT"
          echo "Lava Job: $job_url"
          echo "JOB_ID=$job_id" >> "$GITHUB_ENV"

      - name: Save Job ID for Reporting
        if: always()
        shell: bash
        env:
          MACHINE: ${{ matrix.build_matrix.machine }}
        run: |
          set -euo pipefail
          printf '{"id":"%s","machine":"%s"}\n' "$JOB_ID" "$MACHINE" > "lava-job-$MACHINE.json"

      - name: Upload Job ID Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lava-job-data-${{ matrix.build_matrix.machine }}
          path: lava-job-${{ matrix.build_matrix.machine }}.json

      - name: Check lava job results
        id: check_job
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          LAVA_OSS_TOKEN: ${{ secrets.LAVA_OSS_TOKEN }}
          LAVA_OSS_USER: ${{ secrets.LAVA_OSS_USER }}
        run: |
          set -euo pipefail

          STATE=""
          HEALTH=""
          START_TIME=$(date +%s)
          TIMEOUT_SECONDS=$((2 * 60 * 60))

          get_lava_field() {
            local content="$1"
            local field="$2"
            printf '%s\n' "$content" \
              | sed -nE "s/^[[:space:]]*-?[[:space:]]*${field}[[:space:]]*:[[:space:]]*(.*)[[:space:]]*$/\1/pI" \
              | head -n 1 \
              | xargs
          }

          echo "Waiting for Job $JOB_ID to finish..."

          while [ "$STATE" != "Finished" ]; do
            JOB_INFO="$(
              docker run -i --rm \
                --workdir="$PWD" \
                -v "$(dirname "$PWD")":"$(dirname "$PWD")" \
                "$DOCKER_IMAGE" \
                sh -c "lavacli identities add --token \"$LAVA_OSS_TOKEN\" --uri https://lava-oss.qualcomm.com/RPC2 --username \"$LAVA_OSS_USER\" production > /dev/null 2>&1 || true; lavacli -i production jobs show \"$JOB_ID\""
            )"

            STATE=$(get_lava_field "$JOB_INFO" "state")
            HEALTH=$(get_lava_field "$JOB_INFO" "Health")

            echo "Current status: ${STATE:-WAITING_FOR_METADATA} (Health: ${HEALTH:-Unknown})"

            if [ "$STATE" = "Finished" ]; then
              break
            fi

            if [ $(( $(date +%s) - START_TIME )) -ge $TIMEOUT_SECONDS ]; then
              echo "::error::Timeout reached (2 hours)."
              exit 1
            fi

            sleep 30
          done

          if [ "${HEALTH:-}" != "Complete" ]; then
            echo "::error::Job health is $HEALTH (not Complete). Check LAVA logs for infrastructure failure."
            echo "summary=:warning: LAVA Job $HEALTH" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Fetching detailed results..."
          docker run -i --rm \
            --workdir="$PWD" \
            -v "$(dirname "$PWD")":"$(dirname "$PWD")" \
            "$DOCKER_IMAGE" \
            sh -c "lavacli identities add --token \"$LAVA_OSS_TOKEN\" --uri https://lava-oss.qualcomm.com/RPC2 --username \"$LAVA_OSS_USER\" production > /dev/null 2>&1 || true; lavacli -i production results \"$JOB_ID\"" \
            > lava_results.txt

          RESULTS=$(grep -E '^\* 0_video_pre-merge-tests\.Video_V4L2_Runner \[(pass|fail)\]' lava_results.txt || true)

          if [ -z "$RESULTS" ]; then
            echo "::error::Testcase 0_video_pre-merge-tests.Video_V4L2_Runner not found in results!"
            echo "summary=:x: Video_V4L2_Runner result not found" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Found result lines:"
          echo "$RESULTS"

          if echo "$RESULTS" | grep -q "\[fail\]"; then
            echo "FAILURE: Video_V4L2_Runner detected a fail result."
            echo "summary=:x: Video_V4L2_Runner Failed" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "SUCCESS: Video_V4L2_Runner passed."
            echo "summary=:heavy_check_mark: Video_V4L2_Runner Passed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

  generate-summary:
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all Job IDs
        uses: actions/download-artifact@v4
        with:
          pattern: lava-job-data-*
          merge-multiple: true
          path: artifacts

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Generate LAVA Test Job Summary
        id: generate
        shell: bash
        env:
          LAVA_URL: https://lava-oss.qualcomm.com
          LAVA_TOKEN: ${{ secrets.LAVA_OSS_TOKEN }}
          SUMMARY_FILE: step-summary.md
        run: |
          set -euo pipefail

          INPUT="$(
            find artifacts -name 'lava-job-*.json' -print0 | while IFS= read -r -d '' TESTJOB; do
              JOB_ID=$(jq -r '.id' "$TESTJOB")
              AUTH_HEADER="Authorization: Token $LAVA_TOKEN"

              JOB_DETAILS=$(curl -s -H "$AUTH_HEADER" "$LAVA_URL/api/v0.2/jobs/$JOB_ID/")
              JOB_STATE=$(echo "$JOB_DETAILS" | jq -r '.state // empty')
              JOB_DEVICE_TYPE=$(echo "$JOB_DETAILS" | jq -r '.requested_device_type // empty')

              if [ -z "$JOB_DEVICE_TYPE" ] || [ "$JOB_DEVICE_TYPE" = "null" ]; then
                JOB_DEVICE_TYPE="unknown-$JOB_ID"
              fi

              TEST_RESULTS="{}"

              if [ "$JOB_STATE" = "Finished" ]; then
                JOB_SUITES=$(curl -s -H "$AUTH_HEADER" "$LAVA_URL/api/v0.2/jobs/$JOB_ID/suites/")

                TEST_RESULTS="$(
                  echo "$JOB_SUITES" | jq -c '.results[]?' | while IFS= read -r SUITE; do
                    SUITE_NAME=$(echo "$SUITE" | jq -r '.name')
                    SUITE_ID=$(echo "$SUITE" | jq -r '.id')

                    if [ "$SUITE_NAME" != "lava" ]; then
                      SUITE_TESTS=$(curl -s -H "$AUTH_HEADER" "$LAVA_URL/api/v0.2/jobs/$JOB_ID/suites/$SUITE_ID/tests/")

                      echo "$SUITE_TESTS" | jq -c '.results[]?' | while IFS= read -r TEST_ITEM; do
                        T_NAME=$(echo "$TEST_ITEM" | jq -r '.name')
                        T_RESULT=$(echo "$TEST_ITEM" | jq -r '.result')
                        TEST_URL="$LAVA_URL/results/$JOB_ID/$SUITE_ID"

                        if [ -n "$T_NAME" ] && [ "$T_NAME" != "null" ]; then
                          jq -n -c \
                            --arg key "$T_NAME" \
                            --arg url "$TEST_URL" \
                            --arg result "$T_RESULT" \
                            '{key: $key, value: {url: $url, result: $result}}'
                        fi
                      done
                    else
                      TEST_NAME="boot"
                      TEST_URL="$LAVA_URL/results/$JOB_ID"
                      jq -n -c \
                        --arg key "$TEST_NAME" \
                        --arg url "$TEST_URL" \
                        --arg result "pass" \
                        '{key: $key, value: {url: $url, result: $result}}'
                    fi
                  done | jq -s -c 'from_entries'
                )"
              fi

              jq -n -c \
                --arg key "$JOB_DEVICE_TYPE" \
                --argjson value "$TEST_RESULTS" \
                '{key: $key, value: $value}'
            done | jq -s -c 'reduce .[] as $i ({}; .[$i.key] = ((.[$i.key] // {}) + $i.value))'
          )"

          DEVICES=$(echo "$INPUT" | jq -r 'keys[]' | sort)
          RESULTS=$(echo "$INPUT" | jq -r '.[] | keys[]?' | sort -u)

          echo "### LAVA Test Summary" > "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          printf "| Test Case |" >> "$SUMMARY_FILE"
          for D in $DEVICES; do
            printf " %s |" "$D" >> "$SUMMARY_FILE"
          done
          echo "" >> "$SUMMARY_FILE"

          printf "| :--- |" >> "$SUMMARY_FILE"
          for _ in $DEVICES; do
            printf " :---: |" >> "$SUMMARY_FILE"
          done
          echo "" >> "$SUMMARY_FILE"

          for R in $RESULTS; do
            printf "| **%s** |" "$R" >> "$SUMMARY_FILE"

            for D in $DEVICES; do
              VALUE=$(echo "$INPUT" | jq -r --arg d "$D" --arg r "$R" '.[$d][$r].result // ""')
              URL=$(echo "$INPUT" | jq -r --arg d "$D" --arg r "$R" '.[$d][$r].url // ""')

              ICON=":no_entry_sign:"
              if [ "$VALUE" = "pass" ]; then ICON=":white_check_mark:"; fi
              if [ "$VALUE" = "fail" ]; then ICON=":x:"; fi
              if [ "$VALUE" = "skip" ]; then ICON=":warning:"; fi

              if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                printf " [%s](%s) |" "$ICON" "$URL" >> "$SUMMARY_FILE"
              else
                printf " %s |" "$ICON" >> "$SUMMARY_FILE"
              fi
            done

            echo "" >> "$SUMMARY_FILE"
          done

          echo "" >> "$SUMMARY_FILE"
          echo "#### Job Details" >> "$SUMMARY_FILE"
          echo "| Job ID | Device | State | Health | Link |" >> "$SUMMARY_FILE"
          echo "| :--- | :--- | :--- | :--- | :--- |" >> "$SUMMARY_FILE"

          find artifacts -name 'lava-job-*.json' -print0 | while IFS= read -r -d '' TESTJOB; do
            JOB_ID=$(jq -r '.id' "$TESTJOB")
            AUTH_HEADER="Authorization: Token $LAVA_TOKEN"
            JOB_DETAILS=$(curl -s -H "$AUTH_HEADER" "$LAVA_URL/api/v0.2/jobs/$JOB_ID/")

            HEALTH=$(echo "$JOB_DETAILS" | jq -r '.health')
            STATE=$(echo "$JOB_DETAILS" | jq -r '.state')
            DEVICE=$(echo "$JOB_DETAILS" | jq -r '.requested_device_type')
            URL="$LAVA_URL/results/$JOB_ID"

            echo "| $JOB_ID | $DEVICE | $STATE | $HEALTH | [View]($URL) |" >> "$SUMMARY_FILE"
          done

          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Summary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lava-summary-report
          path: step-summary.md