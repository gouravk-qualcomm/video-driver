---
name: pre_merge
run-name: Pre Merge Workflow
on:
  workflow_dispatch:
  pull_request_target: # requiring access to base repo
    types: [opened, synchronize, reopened]
    branches:
      - fix-mounting

jobs:
  loading:
    uses: qualcomm-linux/video-driver/.github/workflows/loading.yml@fix-mounting
    secrets: inherit

  build:
    needs: loading
    uses: qualcomm-linux/video-driver/.github/workflows/build.yml@fix-mounting
    secrets: inherit
    with:
      build_matrix: ${{ needs.loading.outputs.build_matrix }}

  process_image:
    needs: [loading, build]
    uses: qualcomm-linux/video-driver/.github/workflows/process_image.yml@fix-mounting
    with:
      build_matrix: ${{ needs.loading.outputs.build_matrix }}
