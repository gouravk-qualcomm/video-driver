name: Sync and Build

on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: Docker image to use for the build
        required: false
        type: string
        default: kmake-image:ver.1.0
      build_matrix:
        description: Build matrix for multi target builds
        type: string
        required: true
  workflow_call:
    inputs:
      docker_image:
        description: Docker image to use for the build
        required: false
        type: string
        default: kmake-image:ver.1.0
      build_matrix:
        description: Build matrix for multi target builds
        type: string
        required: true

permissions:
  packages: read

jobs:
  sync-and-build:
    runs-on:
      group: GHA-video-Prd-SelfHosted-RG
      labels: [self-hosted, video-prd-u2204-x64-large-od-ephem]

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.build_matrix) }}

    steps:
      - name: Pull Docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: artifacts.codelinaro.org/clo-420-qli-registry

      - name: Checkout Video Driver
        uses: actions/checkout@v4
        with:
          path: video-driver
          fetch-depth: 0

      - name: Build workspace
        id: build_workspace
        uses: qualcomm-linux/video-driver/.github/actions/build@video.qclinuxmain.root
        with:
          docker_image: ${{ inputs.docker_image }}
          workspace_path: ${{ github.workspace }}

      - name: Fix Workspace Ownership
        if: always()
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"

      - name: Install helper tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y python3-pip mtools device-tree-compiler
          python3 -m pip install --user -q pefile
          curl -fsSL -o "ukify.py" "https://raw.githubusercontent.com/systemd/systemd/main/src/ukify/ukify.py"
          chmod +x "ukify.py"

      - name: Download target meta tar
        shell: bash
        env:
          META_TAR: ${{ matrix.meta_tar }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          mkdir -p "meta_dir/$MACHINE"
          aws s3 cp "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/artifacts/meta/$META_TAR" "downloads/$META_TAR"
          tar -xf "downloads/$META_TAR" -C "meta_dir/$MACHINE"

      - name: Extract, Align, and Patch UKI
        shell: bash
        env:
          MACHINE: ${{ matrix.machine }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -eu # Removed pipefail to avoid 'find | head' broken pipe error
          
          # 1. Robustly locate artifacts
          EFI_BIN=$(find "meta_dir/$MACHINE" -type f \( -name 'efi.bin' -o -name '*.efi' \) -print -quit)
          DTB_SRC=$(find "video-driver" -type f -name "*.dtb" -print -quit)
          
          echo "Processing EFI: $EFI_BIN"
          echo "Processing DTB: $DTB_SRC"

          # 2. Extract Kernel and Initrd using pefile
          python3 - <<EOF
          import pefile
          import os
          efi_path = "$EFI_BIN"
          if os.path.exists(efi_path):
              pe = pefile.PE(efi_path)
              for section in pe.sections:
                  name = section.Name.decode().strip('\x00')
                  if '.linux' in name:
                      with open('vmlinuz.bin', 'wb') as f: f.write(section.get_data())
                  if '.initrd' in name:
                      with open('initrd.bin', 'wb') as f: f.write(section.get_data())
          EOF

          # 3. Mandatory 64K Alignment (Fixes "FIRMWARE BUG")
          if [ -f vmlinuz.bin ]; then
            truncate -s %65536 vmlinuz.bin
            echo "Kernel aligned to 64K"
          fi

          # 4. Platform Specific Patches
          CLEAN_CMD="rootwait clk_ignore_unused pd_ignore_unused regulator_ignore_unused"
          
          if [[ "$MACHINE" == *"qcs9100"* ]]; then
            # Bypass I2C sync_state stall seen in logs
            NEW_CMD="$CLEAN_CMD rootdelay=10 fw_devlink=off"
            fdtput -t s "$DTB_SRC" "/soc@0/geniqup@ac0000/i2c@a90000" "status" "disabled" 2>/dev/null || true
          elif [[ "$MACHINE" == *"qcs8300"* ]]; then
            # Prevent regulator disable hang seen in logs
            NEW_CMD="$CLEAN_CMD"
            for node in "/soc@0/qcom,rpmh-regulators/regulator-conn-lp05" "/soc@0/qcom,rpmh-regulators/regulator-conn-lp35" "/soc@0/qcom,rpmh-regulators/regulator-conn-lp95"; do
              fdtput -t s "$DTB_SRC" "$node" "regulator-always-on" "" 2>/dev/null || true
            done
            fdtput -t s "$DTB_SRC" "/soc@0/wcn6855-pmu" "status" "disabled" 2>/dev/null || true
          else
            NEW_CMD="$CLEAN_CMD"
          fi

          # 5. Rebuild UKI with corrected --devicetree argument
          mkdir -p uki_out
          echo "$NEW_CMD" > uki_out/cmdline.txt
          
          python3 ./ukify.py build \
            --linux vmlinuz.bin \
            --initrd initrd.bin \
            --cmdline uki_out/cmdline.txt \
            --devicetree "$DTB_SRC" \
            --output uki_out/uki.efi

          echo "UKI_OUT=$(pwd)/uki_out/uki.efi" >> "$GITHUB_ENV"

      - name: Final Summary
        run: |
          ls -lh ${{ env.UKI_OUT }}
          echo "Build successful: ${{ env.UKI_OUT }}"