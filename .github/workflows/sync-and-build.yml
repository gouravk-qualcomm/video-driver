name: Sync and Build

on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: Docker image to use for the build
        required: false
        type: string
        default: kmake-image:ver.1.0
      build_matrix:
        description: Build matrix for multi target builds
        type: string
        required: true
  workflow_call:
    inputs:
      docker_image:
        description: Docker image to use for the build
        required: false
        type: string
        default: kmake-image:ver.1.0
      build_matrix:
        description: Build matrix for multi target builds
        type: string
        required: true

permissions:
  packages: read

jobs:
  sync-and-build:
    runs-on:
      group: GHA-video-Prd-SelfHosted-RG
      labels: [self-hosted, video-prd-u2204-x64-large-od-ephem]

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.build_matrix) }}

    steps:
      - name: Pull Docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: artifacts.codelinaro.org/clo-420-qli-registry

      - name: Checkout Video Driver
        uses: actions/checkout@v4
        with:
          path: video-driver
          fetch-depth: 0

      - name: Sync codebase
        uses: qualcomm-linux/video-driver/.github/actions/sync@video.qclinuxmain.root
        with:
          event_name: ${{ github.event_name }}
          pr_ref: ${{ github.event.pull_request.head.ref }}
          pr_repo: ${{ github.event.pull_request.head.repo.full_name }}
          base_ref: ${{ github.ref_name }}
          caller_workflow: build

      - name: Build workspace
        id: build_workspace
        uses: qualcomm-linux/video-driver/.github/actions/build@video.qclinuxmain.root
        with:
          docker_image: ${{ inputs.docker_image }}
          workspace_path: ${{ github.workspace }}

      - name: Fix Workspace Ownership
        if: always()
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$WORKSPACE"

      - name: Install helper tools
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y python3-pip mtools dosfstools e2tools e2fsprogs device-tree-compiler
          python3 -m pip install --user -q pefile
          curl -fsSL -o "$WORKSPACE/ukify.py" "https://raw.githubusercontent.com/systemd/systemd/main/src/ukify/ukify.py"
          chmod +x "$WORKSPACE/ukify.py"

      - name: Download iris artifacts from S3
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE/downloads/iris_test_app"
          aws s3 cp "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/iris_test_app/" "$WORKSPACE/downloads/iris_test_app/" --recursive
          aws s3 cp "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/artifacts/vpu20_1v.mbn" "$WORKSPACE/downloads/"
          wget -q "https://github.com/qualcomm-linux/qcom-linux-testkit/releases/download/IRIS-Video-Files-v1.0/video_clips_iris.tar.gz" -O "$WORKSPACE/downloads/video_clips_iris.tar.gz"

      - name: Download target meta tar from S3
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          META_TAR: ${{ matrix.meta_tar }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          [ -n "$META_TAR" ] || { echo "meta_tar is empty"; exit 1; }
          mkdir -p "$WORKSPACE/downloads" "$WORKSPACE/meta_dir"
          aws s3 cp "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/artifacts/meta/$META_TAR" "$WORKSPACE/downloads/$META_TAR"
          rm -rf "$WORKSPACE/meta_dir/$MACHINE"
          mkdir -p "$WORKSPACE/meta_dir/$MACHINE"
          tar -xf "$WORKSPACE/downloads/$META_TAR" -C "$WORKSPACE/meta_dir/$MACHINE"

      - name: Locate boot artifacts
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          EFI_BIN="$(find "$WORKSPACE" -type f \( -name 'efi.bin' -o -name '*.efi' -o -name 'Image.efi' \) | head -n 1 || true)"
          DTB_SRC="$(find "$WORKSPACE" -type f \( -name '*.dtb' \) | head -n 1 || true)"
          CMDLINE_SRC="$(find "$WORKSPACE" -type f \( -name 'cmdline.txt' -o -name '*cmdline*' \) | head -n 1 || true)"

          echo "EFI_BIN=$EFI_BIN" >> "$GITHUB_ENV"
          echo "DTB_SRC=$DTB_SRC" >> "$GITHUB_ENV"
          echo "CMDLINE_SRC=$CMDLINE_SRC" >> "$GITHUB_ENV"

          echo "Located EFI_BIN=$EFI_BIN"
          echo "Located DTB_SRC=$DTB_SRC"
          echo "Located CMDLINE_SRC=$CMDLINE_SRC"

      - name: Patch kernel cmdline for platform boot fixes
        shell: bash
        env:
          MACHINE: ${{ matrix.machine }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          CLEAN_CMD="rootwait clk_ignore_unused pd_ignore_unused regulator_ignore_unused"
          EXTRA_CMD="fw_devlink=off"

          case "$MACHINE" in
            *qcs9100*|*lemans*)
              NEW_CMD="$CLEAN_CMD rootdelay=10 $EXTRA_CMD"
              ;;
            *qcs8300*|*monaco*)
              NEW_CMD="$CLEAN_CMD"
              ;;
            *)
              NEW_CMD="$CLEAN_CMD"
              ;;
          esac

          echo "NEW_CMD=$NEW_CMD" >> "$GITHUB_ENV"
          echo "Updated cmdline: $NEW_CMD"

      - name: Patch QCS9100 DTB
        if: contains(matrix.machine, 'qcs9100') || contains(matrix.machine, 'lemans')
        shell: bash
        env:
          DTB_SRC: ${{ env.DTB_SRC }}
        run: |
          set -euo pipefail
          [ -n "$DTB_SRC" ] || { echo "DTB_SRC not found"; exit 1; }

          fdtput -t s "$DTB_SRC" "/soc@0/geniqup@ac0000/i2c@a90000" "status" "okay" 2>/dev/null || true
          fdtput -t s "$DTB_SRC" "/soc@0/geniqup@ac0000" "status" "okay" 2>/dev/null || true

          echo "QCS9100 DTB patched"

      - name: Patch QCS8300 regulators
        if: contains(matrix.machine, 'qcs8300') || contains(matrix.machine, 'monaco')
        shell: bash
        env:
          DTB_SRC: ${{ env.DTB_SRC }}
        run: |
          set -euo pipefail
          [ -n "$DTB_SRC" ] || { echo "DTB_SRC not found"; exit 1; }

          for node in \
            "/soc@0/vreg_conn_lp05" \
            "/soc@0/vreg_conn_lp35" \
            "/soc@0/vreg_conn_lp95"
          do
            fdtput -t s "$DTB_SRC" "$node" "status" "okay" 2>/dev/null || true
            fdtput -t s "$DTB_SRC" "$node" "regulator-always-on" "1" 2>/dev/null || true
            fdtput -t s "$DTB_SRC" "$node" "regulator-boot-on" "1" 2>/dev/null || true
          done

          fdtput -t s "$DTB_SRC" "/soc@0/wcn6855-pmu" "status" "disabled" 2>/dev/null || true

          echo "QCS8300 regulator nodes patched"

      - name: Build updated UKI
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          EFI_BIN: ${{ env.EFI_BIN }}
          DTB_SRC: ${{ env.DTB_SRC }}
          NEW_CMD: ${{ env.NEW_CMD }}
        run: |
          set -euo pipefail

          [ -n "$EFI_BIN" ] || { echo "EFI_BIN not found"; exit 1; }

          OUTDIR="$WORKSPACE/uki_out"
          mkdir -p "$OUTDIR"

          CMDLINE_FILE="$OUTDIR/cmdline.txt"
          printf '%s\n' "$NEW_CMD" > "$CMDLINE_FILE"

          if [ -n "${DTB_SRC:-}" ] && [ -f "$DTB_SRC" ]; then
            cp "$DTB_SRC" "$OUTDIR/patched.dtb"
            DTB_ARG="--dtb=$OUTDIR/patched.dtb"
          else
            DTB_ARG=""
          fi

          python3 "$WORKSPACE/ukify.py" build \
            --linux "$EFI_BIN" \
            --cmdline "$CMDLINE_FILE" \
            $DTB_ARG \
            --output "$OUTDIR/uki.efi"

          ls -lh "$OUTDIR"
          echo "UKI_OUT=$OUTDIR/uki.efi" >> "$GITHUB_ENV"

      - name: Final artifact summary
        shell: bash
        env:
          UKI_OUT: ${{ env.UKI_OUT }}
        run: |
          set -euo pipefail
          [ -f "$UKI_OUT" ] || { echo "UKI output missing"; exit 1; }
          ls -lh "$UKI_OUT"
          echo "Build completed successfully"

      - name: Fix Workspace Ownership End
        if: always()
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$WORKSPACE"