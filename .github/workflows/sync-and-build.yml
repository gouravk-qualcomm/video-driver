name: Sync and Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image to use for the build
        required: false
        type: string
        default: kmake-image:ver.1.0
      build_matrix:
        description: Build matrix for multi target builds
        type: string
        required: true

permissions:
  packages: read

jobs:
  sync-and-build:
    runs-on:
      group: GHA-video-Prd-SelfHosted-RG
      labels: [self-hosted, video-prd-u2204-x64-large-od-ephem]

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.build_matrix) }}

    steps:
      - name: Pull Docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}

      - name: Checkout Video Driver
        uses: actions/checkout@v4
        with:
          path: video-driver
          fetch-depth: 0

      - name: Sync codebase
        uses: qualcomm-linux/video-driver/.github/actions/sync@video.qclinux.main.final
        with:
          event_name: ${{ github.event_name }}
          pr_ref: ${{ github.event.pull_request.head.ref }}
          pr_repo: ${{ github.event.pull_request.head.repo.full_name }}
          base_ref: ${{ github.ref_name }}
          caller_workflow: build

      - name: Build workspace
        id: build_workspace
        uses: qualcomm-linux/video-driver/.github/actions/build@video.qclinux.main.final
        with:
          docker_image: kmake-image:ver.1.0
          workspace_path: ${{ github.workspace }}

      - name: Fix Workspace Ownership
        if: always()
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "🔧 Fixing file ownership (root -> runner user)..."
          sudo chown -R "$(id -u):$(id -g)" "$WORKSPACE"

      - name: Install helper tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip mtools dosfstools

      - name: Download iris_test_app from S3
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE/v4l-video-test-app/build/"
          echo "📥 Syncing iris_test_app from S3"
          aws s3 cp \
            "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/iris_test_app/" \
            "$WORKSPACE/v4l-video-test-app/build/" \
            --recursive
          echo "✅ Download complete"
          ls -lh "$WORKSPACE/v4l-video-test-app/build/"

      - name: Download firmware file from S3
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE/downloads"
          echo "📥 Syncing vpu20_1v.mbn from S3"
          aws s3 cp \
            "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/artifacts/vpu20_1v.mbn" \
            "$WORKSPACE/downloads/"
          [ -f "$WORKSPACE/downloads/vpu20_1v.mbn" ] || { echo "❌ Missing vpu20_1v.mbn"; exit 1; }

      - name: Download video contents
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE/downloads"
          echo "📥 Downloading video clips"
          wget -q \
            "https://github.com/qualcomm-linux/qcom-linux-testkit/releases/download/IRIS-Video-Files-v1.0/video_clips_iris.tar.gz" \
            -O "$WORKSPACE/downloads/video_clips_iris.tar.gz"
          [ -f "$WORKSPACE/downloads/video_clips_iris.tar.gz" ] || { echo "❌ Failed to download video_clips_iris.tar.gz"; exit 1; }

      - name: Download target meta tar from S3
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          META_TAR: ${{ matrix.meta_tar }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          [ -n "$META_TAR" ] || { echo "❌ meta_tar is empty for this matrix entry"; exit 1; }

          mkdir -p "$WORKSPACE/downloads"
          mkdir -p "$WORKSPACE/meta"

          echo "📥 Downloading meta tar: $META_TAR"
          aws s3 cp \
            "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/artifacts/meta/$META_TAR" \
            "$WORKSPACE/downloads/$META_TAR"

          META_DIR="$WORKSPACE/meta/$MACHINE"
          rm -rf "$META_DIR"
          mkdir -p "$META_DIR"

          echo "📦 Extracting meta tar into: $META_DIR"
          tar -xf "$WORKSPACE/downloads/$META_TAR" -C "$META_DIR"

          echo "✅ Extracted meta contents:"
          find "$META_DIR" -maxdepth 2 -type f | sort | head -100

      - name: Mount rootfs and inject iris files
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          META_DIR="$WORKSPACE/meta/$MACHINE"
          ROOTFS_IMG="$(find "$META_DIR" -name rootfs.img | head -1)"

          [ -f "$ROOTFS_IMG" ] || { echo "❌ Missing rootfs.img under $META_DIR"; exit 1; }

          echo "📌 Using rootfs image: $ROOTFS_IMG"

          mkdir -p "$WORKSPACE/rootfs_mount"
          sudo umount "$WORKSPACE/rootfs_mount" 2>/dev/null || true
          sudo mount -o loop "$ROOTFS_IMG" "$WORKSPACE/rootfs_mount"

          KVER="$(ls "$WORKSPACE/rootfs_mount/lib/modules/" | head -1)"
          [ -n "$KVER" ] || { echo "❌ Could not detect kernel version in rootfs"; exit 1; }
          echo "📌 Kernel version in rootfs: $KVER"

          sudo mkdir -p "$WORKSPACE/rootfs_mount/lib/modules/$KVER/updates"
          sudo cp "$WORKSPACE/video-driver/video/iris_vpu.ko" \
            "$WORKSPACE/rootfs_mount/lib/modules/$KVER/updates/"

          sudo mkdir -p "$WORKSPACE/rootfs_mount/data/vendor/iris_test_app/firmware"
          sudo cp "$WORKSPACE/v4l-video-test-app/build/iris_v4l2_test" \
            "$WORKSPACE/rootfs_mount/data/vendor/iris_test_app/"
          sudo cp "$WORKSPACE/downloads/vpu20_1v.mbn" \
            "$WORKSPACE/rootfs_mount/data/vendor/iris_test_app/firmware/"
          sudo cp "$WORKSPACE/downloads/video_clips_iris.tar.gz" \
            "$WORKSPACE/rootfs_mount/data/vendor/iris_test_app/"

          sudo chmod +x "$WORKSPACE/rootfs_mount/data/vendor/iris_test_app/iris_v4l2_test"

          sudo depmod -b "$WORKSPACE/rootfs_mount" "$KVER" || true
          sync
          sudo umount "$WORKSPACE/rootfs_mount"

          echo "✅ rootfs.img updated"
          ls -lh "$ROOTFS_IMG"

      - name: Install EFI build tools
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -m pip install --user -q pefile
          curl -fsSL \
            -o "$WORKSPACE/ukify.py" \
            "https://raw.githubusercontent.com/systemd/systemd/main/src/ukify/ukify.py"
          chmod +x "$WORKSPACE/ukify.py"

      - name: Extract UKI, initrd, cmdline and create clean EFI stub
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          META_DIR="$WORKSPACE/meta/$MACHINE"
          EFI_BIN="$(find "$META_DIR" -name efi.bin | head -1)"

          [ -f "$EFI_BIN" ] || { echo "❌ Could not find efi.bin after untar"; exit 1; }

          EFI_MOUNT="$WORKSPACE/efi_mount/$MACHINE"
          TMPDIR="$WORKSPACE/efi_work/$MACHINE"
          mkdir -p "$EFI_MOUNT" "$TMPDIR"

          sudo umount "$EFI_MOUNT" 2>/dev/null || true
          sudo mount -o loop "$EFI_BIN" "$EFI_MOUNT"

          UKI_SRC="$(find "$EFI_MOUNT/EFI/Linux" -maxdepth 1 -name "*.efi" | head -1)"
          [ -f "$UKI_SRC" ] || { echo "❌ Could not find UKI inside efi.bin"; exit 1; }

          echo "📌 Current UKI: $(basename "$UKI_SRC")"

          export WORKSPACE MACHINE UKI_SRC TMPDIR

          python3 << 'EOF'
          import os
          import struct
          import pefile

          work = os.environ["WORKSPACE"]
          machine = os.environ["MACHINE"]
          src = os.environ["UKI_SRC"]
          tmpdir = os.environ["TMPDIR"]

          out_initrd = os.path.join(tmpdir, "initrd.img")
          out_cmdline = os.path.join(tmpdir, "cmdline.txt")
          out_stub = os.path.join(tmpdir, "linuxaa64.efi.stub")

          pe = pefile.PE(src)
          raw = bytearray(open(src, "rb").read())

          keep = {".text", ".rodata", ".data", ".reloc", ".sdmagic"}
          stub_sections = [s for s in pe.sections if s.Name.decode().rstrip("\x00") in keep]

          if not stub_sections:
              raise SystemExit("No stub sections found")

          stub_end = max(s.PointerToRawData + s.SizeOfRawData for s in stub_sections)

          pe_off = struct.unpack_from("<I", raw, 0x3C)[0]
          num_sec_off = pe_off + 4 + 2
          opt_hdr_size = struct.unpack_from("<H", raw, pe_off + 4 + 16)[0]
          sec_table_off = pe_off + 4 + 20 + opt_hdr_size

          new_raw = bytearray(raw[:stub_end])
          struct.pack_into("<H", new_raw, num_sec_off, len(stub_sections))

          for i, s in enumerate(pe.sections):
              name = s.Name.decode().rstrip("\x00")
              if name not in keep:
                  entry_off = sec_table_off + (i * 40)
                  if entry_off + 40 <= len(new_raw):
                      new_raw[entry_off:entry_off+40] = b"\x00" * 40

          size_of_image_off = pe_off + 4 + 20 + 56
          new_size = ((stub_end + 0xFFF) & ~0xFFF)
          struct.pack_into("<I", new_raw, size_of_image_off, new_size)

          os.makedirs(os.path.dirname(out_stub), exist_ok=True)
          with open(out_stub, "wb") as f:
              f.write(new_raw)

          for sec in pe.sections:
              name = sec.Name.decode().rstrip("\x00")
              if name == ".initrd":
                  with open(out_initrd, "wb") as f:
                      f.write(sec.get_data())
              elif name == ".cmdline":
                  with open(out_cmdline, "wb") as f:
                      f.write(sec.get_data().rstrip(b"\x00"))

          print(out_stub)
          print(out_initrd)
          print(out_cmdline)
          EOF

          sudo umount "$EFI_MOUNT"

          echo "✅ Clean EFI stub, initrd and cmdline extracted"
          ls -lh "$TMPDIR/linuxaa64.efi.stub" "$TMPDIR/initrd.img" "$TMPDIR/cmdline.txt"
          echo "--- cmdline ---"
          cat "$TMPDIR/cmdline.txt"

      - name: Generate efi.bin using ukify
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          META_DIR="$WORKSPACE/meta/$MACHINE"
          TMPDIR="$WORKSPACE/efi_work/$MACHINE"
          DTB_PATH="$WORKSPACE/kobj/arch/arm64/boot/dts/qcom/${MACHINE}.dtb"
          UKIFY="$WORKSPACE/ukify.py"

          [ -f "$DTB_PATH" ] || { echo "❌ Missing DTB: $DTB_PATH"; exit 1; }
          [ -f "$TMPDIR/linuxaa64.efi.stub" ] || { echo "❌ Missing EFI stub"; exit 1; }
          [ -f "$TMPDIR/initrd.img" ] || { echo "❌ Missing initrd"; exit 1; }
          [ -f "$TMPDIR/cmdline.txt" ] || { echo "❌ Missing cmdline"; exit 1; }

          python3 "$UKIFY" build \
            --linux "$WORKSPACE/kobj/arch/arm64/boot/Image" \
            --initrd "$TMPDIR/initrd.img" \
            --cmdline @"$TMPDIR/cmdline.txt" \
            --devicetree "$DTB_PATH" \
            --stub "$TMPDIR/linuxaa64.efi.stub" \
            --output "$TMPDIR/linux-$MACHINE.efi"

          echo "✅ UKI generated"
          ls -lh "$TMPDIR/linux-$MACHINE.efi"

          EFI_MOUNT="$WORKSPACE/efi_mount/$MACHINE"
          mkdir -p "$EFI_MOUNT"
          sudo umount "$EFI_MOUNT" 2>/dev/null || true

          EFI_BIN="$(find "$META_DIR" -name efi.bin | head -1)"
          [ -f "$EFI_BIN" ] || { echo "❌ Could not find efi.bin after untar"; exit 1; }

          sudo mount -o loop "$EFI_BIN" "$EFI_MOUNT"

          UKI_NAME="$(find "$EFI_MOUNT/EFI/Linux" -maxdepth 1 -name "*.efi" | head -1 | xargs -n 1 basename)"
          [ -n "$UKI_NAME" ] || { echo "❌ Could not determine UKI filename"; exit 1; }

          sudo cp -fv "$TMPDIR/linux-$MACHINE.efi" "$EFI_MOUNT/EFI/Linux/$UKI_NAME"
          sync
          sudo umount "$EFI_MOUNT"

          echo "✅ efi.bin updated in meta"
          ls -lh "$EFI_BIN"

      - name: Generate dtb.bin and replace target dtb vfat
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          META_DIR="$WORKSPACE/meta/$MACHINE"
          DTB_PATH="$WORKSPACE/kobj/arch/arm64/boot/dts/qcom/${MACHINE}.dtb"
          OUT_DTB="$WORKSPACE/efi_work/$MACHINE/dtb.bin"

          [ -f "$DTB_PATH" ] || { echo "❌ Missing DTB: $DTB_PATH"; exit 1; }

          dd if=/dev/zero of="$OUT_DTB" bs=1K count=4096 status=none
          mkfs.vfat "$OUT_DTB" >/dev/null
          mcopy -i "$OUT_DTB" "$DTB_PATH" ::

          cp -fv "$OUT_DTB" "$META_DIR/dtb.bin"

          if [ -f "$META_DIR/dtb-${MACHINE}-image.vfat" ]; then
            cp -fv "$OUT_DTB" "$META_DIR/dtb-${MACHINE}-image.vfat"
          fi

          if [ -n "$TARGET" ] && [ -f "$META_DIR/dtb-${TARGET}-image.vfat" ]; then
            cp -fv "$OUT_DTB" "$META_DIR/dtb-${TARGET}-image.vfat"
          fi

          echo "✅ dtb.bin updated"
          ls -lh "$META_DIR/dtb.bin"

      - name: Repack updated meta tar
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          META_TAR: ${{ matrix.meta_tar }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          META_DIR="$WORKSPACE/meta/$MACHINE"
          OUTDIR="$WORKSPACE/output"
          mkdir -p "$OUTDIR"

          FINAL_TAR="$OUTDIR/$META_TAR"
          rm -f "$FINAL_TAR"

          tar -C "$META_DIR" -cf "$FINAL_TAR" .

          echo "✅ Repacked meta tar:"
          ls -lh "$FINAL_TAR"

      - name: Append artifacts to S3 upload list
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          META_TAR: ${{ matrix.meta_tar }}
        run: |
          set -euo pipefail

          file_list="$WORKSPACE/artifacts/file_list.txt"
          mkdir -p "$WORKSPACE/artifacts"
          : > "$file_list"

          FINAL_TAR="$WORKSPACE/output/$META_TAR"
          [ -f "$FINAL_TAR" ] || { echo "❌ Missing final meta tar: $FINAL_TAR"; exit 1; }

          echo "$FINAL_TAR" >> "$file_list"
          echo "✅ Queued for upload: $FINAL_TAR"

          echo "----- Files queued for S3 upload -----"
          cat "$file_list"

      - name: Upload final meta tar to S3
        uses: qualcomm-linux/video-driver/.github/actions/aws_s3_helper@video.qclinux.main.final
        with:
          s3_bucket: qli-prd-video-gh-artifacts
          local_file: ${{ github.workspace }}/artifacts/file_list.txt
          mode: multi-upload
          upload_location: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}

      - name: Clean up
        if: always()
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ws="$WORKSPACE"
          rm -rf "$ws/artifacts" || true
          rm -rf "$ws/downloads" || true
          rm -rf "$ws/kobj" || true
          rm -rf "$ws/meta" || true
          rm -rf "$ws/output" || true
          rm -rf "$ws/rootfs_mount" || true
          rm -rf "$ws/efi_work" || true
          rm -rf "$ws/efi_mount" || true
          rm -f "$ws/ukify.py" || true

      - name: Update summary
        if: success() || failure()
        shell: bash
        env:
          BUILD_STATUS: ${{ steps.build_workspace.outcome }}
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
          META_TAR: ${{ matrix.meta_tar }}
        run: |
          set -euo pipefail

          if [ "$BUILD_STATUS" = "success" ]; then
            summary=":heavy_check_mark: Build Success"
          else
            summary=":x: Build Failed"
          fi

          {
            echo "<details><summary><i>Build Summary</i></summary>"
            echo "$summary"
            echo ""
            echo "- Machine: $MACHINE"
            echo "- Meta tar: $META_TAR"
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"