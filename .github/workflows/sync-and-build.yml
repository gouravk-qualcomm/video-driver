name: Sync and Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image to use for the build
        required: false
        type: string
        default: kmake-image:ver.1.0
      build_matrix:
        description: Build matrix for multi target builds
        type: string
        required: true

permissions:
  packages: read

jobs:
  sync-and-build:
    runs-on:
      group: GHA-video-Prd-SelfHosted-RG
      labels: [self-hosted, video-prd-u2204-x64-large-od-ephem]

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.build_matrix) }}

    steps:
      - name: Pull Docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: artifacts.codelinaro.org/clo-420-qli-registry

      - name: Checkout Video Driver
        uses: actions/checkout@v4
        with:
          path: video-driver
          fetch-depth: 0

      - name: Sync codebase
        uses: qualcomm-linux/video-driver/.github/actions/sync@video.qclinuxmain.root
        with:
          event_name: ${{ github.event_name }}
          pr_ref: ${{ github.event.pull_request.head.ref }}
          pr_repo: ${{ github.event.pull_request.head.repo.full_name }}
          base_ref: ${{ github.ref_name }}
          caller_workflow: build

      - name: Build workspace
        id: build_workspace
        uses: qualcomm-linux/video-driver/.github/actions/build@video.qclinuxmain.root
        with:
          docker_image: ${{ inputs.docker_image }}
          workspace_path: ${{ github.workspace }}

      - name: Fix Workspace Ownership
        if: always()
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "🔧 Fixing file ownership (root -> runner user)..."
          sudo chown -R "$(id -u):$(id -g)" "$WORKSPACE"

      - name: Install helper tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip mtools dosfstools
          python3 -m pip install --user -q pefile

      - name: Download iris artifacts from S3
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE/downloads/iris_test_app"
          aws s3 cp \
            "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/iris_test_app/" \
            "$WORKSPACE/downloads/iris_test_app/" \
            --recursive
          aws s3 cp \
            "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/artifacts/vpu20_1v.mbn" \
            "$WORKSPACE/downloads/"
          wget -q \
            "https://github.com/qualcomm-linux/qcom-linux-testkit/releases/download/IRIS-Video-Files-v1.0/video_clips_iris.tar.gz" \
            -O "$WORKSPACE/downloads/video_clips_iris.tar.gz"

          ls -lh "$WORKSPACE/downloads/iris_test_app/"
          ls -lh "$WORKSPACE/downloads/vpu20_1v.mbn"
          ls -lh "$WORKSPACE/downloads/video_clips_iris.tar.gz"

      - name: Download target meta tar from S3
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          META_TAR: ${{ matrix.meta_tar }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          [ -n "$META_TAR" ] || { echo "❌ meta_tar is empty for this matrix entry"; exit 1; }

          mkdir -p "$WORKSPACE/downloads"
          mkdir -p "$WORKSPACE/meta_dir"

          echo "📥 Downloading meta tar: $META_TAR"
          aws s3 cp \
            "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/artifacts/meta/$META_TAR" \
            "$WORKSPACE/downloads/$META_TAR"

          rm -rf "$WORKSPACE/meta_dir/$MACHINE"
          mkdir -p "$WORKSPACE/meta_dir/$MACHINE"

          echo "📦 Extracting meta tar into: $WORKSPACE/meta_dir/$MACHINE"
          tar -xf "$WORKSPACE/downloads/$META_TAR" -C "$WORKSPACE/meta_dir/$MACHINE"

          echo "✅ Extracted meta contents:"
          find "$WORKSPACE/meta_dir/$MACHINE" -maxdepth 2 -type f | sort | head -100

      - name: Mount rootfs and inject artifacts
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          META_DIR="$WORKSPACE/meta_dir/$MACHINE"
          ROOTFS_IMG="$(find "$META_DIR" -name "rootfs.img" | head -1)"

          [ -f "$ROOTFS_IMG" ] || { echo "❌ rootfs.img not found under $META_DIR"; exit 1; }

          echo "📌 Using rootfs image: $ROOTFS_IMG"

          mkdir -p "$WORKSPACE/rootfs_mount"
          sudo umount "$WORKSPACE/rootfs_mount" 2>/dev/null || true
          sudo mount -o loop "$ROOTFS_IMG" "$WORKSPACE/rootfs_mount"

          KVER="$(ls "$WORKSPACE/rootfs_mount/lib/modules/" | head -1)"
          [ -n "$KVER" ] || { echo "❌ Could not detect kernel version in rootfs"; exit 1; }
          echo "📌 Kernel version in rootfs: $KVER"

          sudo mkdir -p "$WORKSPACE/rootfs_mount/lib/modules/$KVER/updates"
          sudo cp "$WORKSPACE/video-driver/video/iris_vpu.ko" \
            "$WORKSPACE/rootfs_mount/lib/modules/$KVER/updates/"

          sudo mkdir -p "$WORKSPACE/rootfs_mount/data/vendor/iris_test_app/firmware"
          sudo cp "$WORKSPACE/downloads/iris_test_app/iris_v4l2_test" \
            "$WORKSPACE/rootfs_mount/data/vendor/iris_test_app/"
          sudo cp "$WORKSPACE/downloads/vpu20_1v.mbn" \
            "$WORKSPACE/rootfs_mount/data/vendor/iris_test_app/firmware/"
          sudo cp "$WORKSPACE/downloads/video_clips_iris.tar.gz" \
            "$WORKSPACE/rootfs_mount/data/vendor/iris_test_app/"

          sudo chmod +x "$WORKSPACE/rootfs_mount/data/vendor/iris_test_app/iris_v4l2_test"

          sudo depmod -b "$WORKSPACE/rootfs_mount" "$KVER" || true
          sync
          sudo umount "$WORKSPACE/rootfs_mount"

          echo "✅ rootfs.img updated"
          ls -lh "$ROOTFS_IMG"

      - name: Install EFI build tools
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -o "$WORKSPACE/ukify.py" \
            "https://raw.githubusercontent.com/systemd/systemd/main/src/ukify/ukify.py"
          chmod +x "$WORKSPACE/ukify.py"

      - name: Rebuild efi.bin (UKI + 64k alignment + rootdelay fix)
        # Fix 1: Use mtools (mcopy/mdir) instead of loop mount to read/write the
        #         FAT filesystem inside efi.bin. Loop mount + umount inside a
        #         container environment does not reliably flush changes back to the
        #         image file, leaving the FAT superblock corrupt and causing:
        #           "EFI GUID based mount skipped ... Status = Not Found"
        #           "ASSERT QcomBds.c +858: 0"
        # Fix 2: Align the kernel Image to a 64K boundary before passing it to
        #         ukify to eliminate:
        #           "EFI stub: FIRMWARE BUG: kernel image not aligned on 64k boundary"
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          META_DIR="$WORKSPACE/meta_dir/$MACHINE"
          EFI_BIN="$(find "$META_DIR" -name "efi.bin" | head -1)"
          DTB_SRC="$WORKSPACE/kobj/arch/arm64/boot/dts/qcom/${MACHINE}.dtb"
          TMP_EFI="$WORKSPACE/efi_rebuild/$MACHINE"

          [ -f "$EFI_BIN" ] || { echo "❌ efi.bin not found under $META_DIR"; exit 1; }
          [ -f "$DTB_SRC" ] || { echo "❌ DTB not found: $DTB_SRC"; exit 1; }

          mkdir -p "$TMP_EFI"

          # ── Locate the UKI .efi path inside the FAT image using mtools ──────
          echo "🔍 Listing EFI/Linux contents of efi.bin via mtools..."
          UKI_FAT_PATH="$(mdir -i "$EFI_BIN" -/ -b ::EFI/Linux 2>/dev/null \
            | grep -i '\.efi$' | head -1 | sed 's|^::|::|')"

          [ -n "$UKI_FAT_PATH" ] || {
            echo "❌ Could not find a .efi file inside efi.bin at EFI/Linux/"
            echo "   Contents of efi.bin root:"
            mdir -i "$EFI_BIN" -/ -b :: || true
            exit 1
          }
          UKI_NAME="$(basename "$UKI_FAT_PATH")"
          echo "📌 Found UKI inside efi.bin: $UKI_FAT_PATH  (filename: $UKI_NAME)"

          # ── Extract the UKI from the FAT image using mcopy ───────────────────
          UKI_LOCAL="$TMP_EFI/original_uki.efi"
          mcopy -i "$EFI_BIN" "$UKI_FAT_PATH" "$UKI_LOCAL"
          echo "✅ Extracted UKI → $UKI_LOCAL ($(stat -c %s "$UKI_LOCAL") bytes)"

          # ── Parse the UKI: extract initrd, cmdline, stub ─────────────────────
          export UKI_SRC="$UKI_LOCAL"
          export REBUILD_DIR="$TMP_EFI"

          python3 << 'EOF'
          import os
          import pefile
          import struct

          uki_path = os.environ["UKI_SRC"]
          rebuild_dir = os.environ["REBUILD_DIR"]

          pe = pefile.PE(uki_path)
          with open(uki_path, "rb") as f:
              raw = bytearray(f.read())

          for sec in pe.sections:
              name = sec.Name.decode().rstrip("\x00")
              if name == ".initrd":
                  with open(os.path.join(rebuild_dir, "initrd.img"), "wb") as f:
                      f.write(sec.get_data())
                  print(f"  extracted .initrd  ({sec.SizeOfRawData} bytes)")
              elif name == ".cmdline":
                  with open(os.path.join(rebuild_dir, "cmdline.txt"), "wb") as f:
                      f.write(sec.get_data().rstrip(b"\x00"))
                  print(f"  extracted .cmdline ({sec.SizeOfRawData} bytes)")

          keep = {".text", ".rodata", ".data", ".reloc", ".sdmagic"}
          stub_sections = [s for s in pe.sections if s.Name.decode().rstrip("\x00") in keep]
          if not stub_sections:
              raise SystemExit("❌ No stub sections found in UKI")

          stub_end = max(s.PointerToRawData + s.SizeOfRawData for s in stub_sections)

          pe_off = struct.unpack_from("<I", raw, 0x3C)[0]
          num_sec_off = pe_off + 4 + 2
          opt_hdr_size = struct.unpack_from("<H", raw, pe_off + 4 + 16)[0]
          sec_table_off = pe_off + 4 + 20 + opt_hdr_size

          new_raw = bytearray(raw[:stub_end])
          struct.pack_into("<H", new_raw, num_sec_off, len(stub_sections))

          for i, s in enumerate(pe.sections):
              name = s.Name.decode().rstrip("\x00")
              if name not in keep:
                  entry_off = sec_table_off + (i * 40)
                  if entry_off + 40 <= len(new_raw):
                      new_raw[entry_off:entry_off+40] = b"\x00" * 40

          size_of_image_off = pe_off + 4 + 20 + 56
          new_size = ((stub_end + 0xFFF) & ~0xFFF)
          struct.pack_into("<I", new_raw, size_of_image_off, new_size)

          with open(os.path.join(rebuild_dir, "stub.efi"), "wb") as f:
              f.write(new_raw)
          print(f"  extracted stub.efi ({len(new_raw)} bytes)")
          EOF

          # ── Fix 2: Align kernel Image to 64K boundary ─────────────────────
          # Eliminates: "EFI stub: FIRMWARE BUG: kernel image not aligned on 64k boundary"
          KERNEL_SRC="$WORKSPACE/kobj/arch/arm64/boot/Image"
          ALIGNED_IMAGE="$TMP_EFI/Image.aligned"
          cp "$KERNEL_SRC" "$ALIGNED_IMAGE"
          IMAGE_SIZE=$(stat -c %s "$ALIGNED_IMAGE")
          ALIGNED_SIZE=$(( (IMAGE_SIZE + 65535) & ~65535 ))
          if [ "$IMAGE_SIZE" -ne "$ALIGNED_SIZE" ]; then
            echo "📐 Aligning kernel: $IMAGE_SIZE → $ALIGNED_SIZE bytes (64K boundary)"
            truncate -s "$ALIGNED_SIZE" "$ALIGNED_IMAGE"
          else
            echo "📐 Kernel already 64K-aligned ($IMAGE_SIZE bytes)"
          fi

          # ── Append rootdelay to cmdline ───────────────────────────────────
          ORIG_CMD="$(cat "$TMP_EFI/cmdline.txt")"
          NEW_CMD="$ORIG_CMD rootdelay=10 rootwait"
          echo "📝 Cmdline: $NEW_CMD"

          # ── Rebuild UKI with ukify ─────────────────────────────────────────
          NEW_UKI="$TMP_EFI/new_uki.efi"
          python3 "$WORKSPACE/ukify.py" build \
            --linux    "$ALIGNED_IMAGE" \
            --initrd   "$TMP_EFI/initrd.img" \
            --cmdline  "$NEW_CMD" \
            --devicetree "$DTB_SRC" \
            --stub     "$TMP_EFI/stub.efi" \
            --output   "$NEW_UKI"
          echo "✅ New UKI built: $(stat -c %s "$NEW_UKI") bytes"

          # ── Inject new UKI back into efi.bin using mcopy (no loop mount) ──
          # Delete the old .efi first so mcopy does not fail on overwrite,
          # then copy the new one in under the same filename.
          mdel  -i "$EFI_BIN" "$UKI_FAT_PATH" 2>/dev/null || true
          mcopy -i "$EFI_BIN" "$NEW_UKI" "::EFI/Linux/$UKI_NAME"
          echo "✅ efi.bin updated via mtools (no loop mount)"

          echo "📦 Final efi.bin:"
          ls -lh "$EFI_BIN"
          echo "📋 EFI/Linux contents:"
          mdir -i "$EFI_BIN" ::EFI/Linux

      - name: Rebuild dtb.bin
        # Fix: mcopy renames the DTB to combined-dtb.dtb inside the FAT image.
        # UEFI searches by that fixed name; using the machine-specific filename
        # caused: "DtPlatformLoadDtbBlob combined-dtb.dtb load failed"
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          DTB_BIN="$(find "$WORKSPACE/meta_dir/$MACHINE" -name "dtb.bin" | head -1)"
          DTB_SRC="$WORKSPACE/kobj/arch/arm64/boot/dts/qcom/${MACHINE}.dtb"

          [ -f "$DTB_BIN" ] || { echo "❌ dtb.bin not found"; exit 1; }
          [ -f "$DTB_SRC" ] || { echo "❌ DTB not found: $DTB_SRC"; exit 1; }

          dd if=/dev/zero of="$WORKSPACE/new_dtb.bin" bs=1K count=4096 status=none
          mkfs.vfat "$WORKSPACE/new_dtb.bin" >/dev/null
          # Rename to combined-dtb.dtb so UEFI DtPlatformLoadDtbBlob finds it
          mcopy -i "$WORKSPACE/new_dtb.bin" "$DTB_SRC" :::combined-dtb.dtb
          cp -fv "$WORKSPACE/new_dtb.bin" "$DTB_BIN"
          echo "✅ dtb.bin updated (combined-dtb.dtb)"
          ls -lh "$DTB_BIN"

      - name: Repack updated meta tar
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          META_TAR: ${{ matrix.meta_tar }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          META_DIR="$WORKSPACE/meta_dir/$MACHINE"
          OUTDIR="$WORKSPACE/output"
          mkdir -p "$OUTDIR"

          FINAL_TAR="$OUTDIR/$META_TAR"
          rm -f "$FINAL_TAR"

          tar -C "$META_DIR" -cf "$FINAL_TAR" .

          echo "✅ Repacked meta tar:"
          ls -lh "$FINAL_TAR"

      - name: Append artifacts to S3 upload list
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          META_TAR: ${{ matrix.meta_tar }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          mkdir -p "$WORKSPACE/artifacts"
          FILE_LIST="$WORKSPACE/artifacts/file_list.txt"
          : > "$FILE_LIST"

          FINAL_TAR="$WORKSPACE/output/$META_TAR"
          [ -f "$FINAL_TAR" ] || { echo "❌ Missing final meta tar: $FINAL_TAR"; exit 1; }

          echo "$FINAL_TAR" >> "$FILE_LIST"
          echo "✅ Queued for upload: $FINAL_TAR"
          cat "$FILE_LIST"

      - name: Upload updated meta to S3
        uses: qualcomm-linux/video-driver/.github/actions/aws_s3_helper@video.qclinuxmain.root
        with:
          s3_bucket: qli-prd-video-gh-artifacts
          local_file: ${{ github.workspace }}/artifacts/file_list.txt
          mode: multi-upload
          upload_location: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}

      - name: Clean up
        if: always()
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ws="$WORKSPACE"
          sudo umount "$ws/rootfs_mount" 2>/dev/null || true
          rm -rf "$ws/artifacts"   || true
          rm -rf "$ws/downloads"   || true
          rm -rf "$ws/kobj"        || true
          rm -rf "$ws/meta_dir"    || true
          rm -rf "$ws/output"      || true
          rm -rf "$ws/rootfs_mount" || true
          rm -rf "$ws/efi_rebuild" || true
          rm -f  "$ws/ukify.py"    || true
          rm -f  "$ws/new_dtb.bin" || true

      - name: Update summary
        if: success() || failure()
        shell: bash
        env:
          BUILD_STATUS: ${{ steps.build_workspace.outcome }}
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
          META_TAR: ${{ matrix.meta_tar }}
        run: |
          set -euo pipefail

          if [ "$BUILD_STATUS" = "success" ]; then
            summary=":heavy_check_mark: Build Success"
          else
            summary=":x: Build Failed"
          fi

          {
            echo "<details><summary><i>Build Summary</i></summary>"
            echo "$summary"
            echo ""
            echo "- Machine: $MACHINE"
            echo "- Meta tar: $META_TAR"
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
