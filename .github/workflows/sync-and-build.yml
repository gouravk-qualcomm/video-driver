name: Sync and Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image to use for the build
        required: false
        type: string
        default: kmake-image:ver.1.0
      build_matrix:
        description: Build matrix for multi target builds
        type: string
        required: true

permissions:
  packages: read

jobs:
  sync-and-build:
    runs-on:
      group: GHA-video-Prd-SelfHosted-RG
      labels: [self-hosted, video-prd-u2204-x64-large-od-ephem]

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.build_matrix) }}

    steps:
      - name: Pull Docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: artifacts.codelinaro.org/clo-420-qli-registry

      - name: Checkout Video Driver
        uses: actions/checkout@v4
        with:
          path: video-driver
          fetch-depth: 0

      - name: Sync codebase
        uses: qualcomm-linux/video-driver/.github/actions/sync@video.qclinuxmain.root
        with:
          event_name: ${{ github.event_name }}
          pr_ref: ${{ github.event.pull_request.head.ref }}
          pr_repo: ${{ github.event.pull_request.head.repo.full_name }}
          base_ref: ${{ github.ref_name }}
          caller_workflow: build

      - name: Build workspace
        id: build_workspace
        uses: qualcomm-linux/video-driver/.github/actions/build@video.qclinuxmain.root
        with:
          docker_image: ${{ inputs.docker_image }}
          workspace_path: ${{ github.workspace }}

      - name: Fix Workspace Ownership
        if: always()
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "🔧 Fixing file ownership (root -> runner user)..."
          sudo chown -R "$(id -u):$(id -g)" "$WORKSPACE"

      - name: Install helper tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip mtools dosfstools e2tools e2fsprogs
          python3 -m pip install --user -q pefile
          curl -fsSL \
            -o "${{ github.workspace }}/ukify.py" \
            "https://raw.githubusercontent.com/systemd/systemd/main/src/ukify/ukify.py"
          chmod +x "${{ github.workspace }}/ukify.py"

      - name: Download iris artifacts from S3
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE/downloads/iris_test_app"
          aws s3 cp \
            "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/iris_test_app/" \
            "$WORKSPACE/downloads/iris_test_app/" \
            --recursive
          aws s3 cp \
            "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/artifacts/vpu20_1v.mbn" \
            "$WORKSPACE/downloads/"
          wget -q \
            "https://github.com/qualcomm-linux/qcom-linux-testkit/releases/download/IRIS-Video-Files-v1.0/video_clips_iris.tar.gz" \
            -O "$WORKSPACE/downloads/video_clips_iris.tar.gz"

          ls -lh "$WORKSPACE/downloads/iris_test_app/"
          ls -lh "$WORKSPACE/downloads/vpu20_1v.mbn"
          ls -lh "$WORKSPACE/downloads/video_clips_iris.tar.gz"

      - name: Download target meta tar from S3
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          META_TAR: ${{ matrix.meta_tar }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          [ -n "$META_TAR" ] || { echo "❌ meta_tar is empty for this matrix entry"; exit 1; }

          mkdir -p "$WORKSPACE/downloads"
          mkdir -p "$WORKSPACE/meta_dir"

          echo "📥 Downloading meta tar: $META_TAR"
          aws s3 cp \
            "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/artifacts/meta/$META_TAR" \
            "$WORKSPACE/downloads/$META_TAR"

          rm -rf "$WORKSPACE/meta_dir/$MACHINE"
          mkdir -p "$WORKSPACE/meta_dir/$MACHINE"

          echo "📦 Extracting meta tar into: $WORKSPACE/meta_dir/$MACHINE"
          tar -xf "$WORKSPACE/downloads/$META_TAR" -C "$WORKSPACE/meta_dir/$MACHINE"

          echo "✅ Extracted meta contents:"
          find "$WORKSPACE/meta_dir/$MACHINE" -maxdepth 2 -type f | sort | head -100

      - name: Inject artifacts into rootfs image
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          META_DIR="$WORKSPACE/meta_dir/$MACHINE"
          ROOTFS_IMG="$(find "$META_DIR" -name "rootfs.img" | head -1)"

          [ -f "$ROOTFS_IMG" ] || { echo "❌ rootfs.img not found under $META_DIR"; exit 1; }
          echo "📌 Using rootfs image: $ROOTFS_IMG"

          # Detect kernel version from rootfs using debugfs (no loop mount needed)
          KVER="$(debugfs -R "ls /lib/modules" "$ROOTFS_IMG" 2>/dev/null \
            | grep -oP '[0-9]+\.[0-9]+\.[0-9a-zA-Z._+-]+' | head -1)"
          [ -n "$KVER" ] || { echo "❌ Could not detect kernel version in rootfs via debugfs"; exit 1; }
          echo "📌 Kernel version in rootfs: $KVER"

          # Create required directories
          debugfs -w -R "mkdir /lib/modules/$KVER/updates" "$ROOTFS_IMG" 2>/dev/null || true
          debugfs -w -R "mkdir /data" "$ROOTFS_IMG" 2>/dev/null || true
          debugfs -w -R "mkdir /data/vendor" "$ROOTFS_IMG" 2>/dev/null || true
          debugfs -w -R "mkdir /data/vendor/iris_test_app" "$ROOTFS_IMG" 2>/dev/null || true
          debugfs -w -R "mkdir /data/vendor/iris_test_app/firmware" "$ROOTFS_IMG" 2>/dev/null || true

          # Copy kernel module
          debugfs -w -R \
            "write $WORKSPACE/video-driver/video/iris_vpu.ko /lib/modules/$KVER/updates/iris_vpu.ko" \
            "$ROOTFS_IMG"

          # Copy test application and data
          debugfs -w -R \
            "write $WORKSPACE/downloads/iris_test_app/iris_v4l2_test /data/vendor/iris_test_app/iris_v4l2_test" \
            "$ROOTFS_IMG"
          debugfs -w -R \
            "write $WORKSPACE/downloads/vpu20_1v.mbn /data/vendor/iris_test_app/firmware/vpu20_1v.mbn" \
            "$ROOTFS_IMG"
          debugfs -w -R \
            "write $WORKSPACE/downloads/video_clips_iris.tar.gz /data/vendor/iris_test_app/video_clips_iris.tar.gz" \
            "$ROOTFS_IMG"

          # Set executable permission on test binary (mode 0100755)
          debugfs -w -R \
            "set_inode_field /data/vendor/iris_test_app/iris_v4l2_test mode 0100755" \
            "$ROOTFS_IMG" 2>/dev/null || true

          # Verify filesystem integrity after writes
          echo "🔍 Checking rootfs.img integrity..."
          e2fsck -p -f "$ROOTFS_IMG" || true

          echo "✅ rootfs.img updated successfully"
          ls -lh "$ROOTFS_IMG"

      - name: Rebuild efi.bin (UKI + 64K alignment + rootdelay fix)
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          META_DIR="$WORKSPACE/meta_dir/$MACHINE"
          EFI_BIN="$(find "$META_DIR" -name "efi.bin" | head -1)"
          DTB_SRC="$WORKSPACE/kobj/arch/arm64/boot/dts/qcom/${MACHINE}.dtb"
          TMP_EFI="$WORKSPACE/efi_rebuild/$MACHINE"

          [ -f "$EFI_BIN" ] || { echo "❌ efi.bin not found"; exit 1; }
          [ -f "$DTB_SRC" ] || { echo "❌ DTB not found: $DTB_SRC"; exit 1; }

          mkdir -p "$TMP_EFI"

          # ── Step 1: List EFI/Linux directory inside efi.bin using mtools ──
          echo "📂 Contents of EFI/Linux inside efi.bin:"
          mdir -i "$EFI_BIN" ::/EFI/Linux/ 2>/dev/null || \
            mdir -i "$EFI_BIN" ::EFI/Linux/ || \
            { echo "❌ Could not list EFI/Linux inside efi.bin"; exit 1; }

          # ── Step 2: Extract UKI .efi using mcopy (no loop mount) ──
          UKI_NAME="$(mdir -i "$EFI_BIN" ::/EFI/Linux/ 2>/dev/null \
            | grep -i '\.efi' | awk '{print $NF}' | head -1)"
          [ -n "$UKI_NAME" ] || { echo "❌ Could not find .efi inside efi.bin"; exit 1; }
          echo "📌 Found UKI: $UKI_NAME"

          mcopy -i "$EFI_BIN" "::/EFI/Linux/$UKI_NAME" "$TMP_EFI/original.efi"
          [ -f "$TMP_EFI/original.efi" ] || { echo "❌ Failed to extract UKI from efi.bin"; exit 1; }

          # ── Step 3: Extract sections from UKI using Python + pefile ──
          export UKI_PATH="$TMP_EFI/original.efi"
          export REBUILD_DIR="$TMP_EFI"

          python3 << 'PYEOF'
          import os, pefile, struct

          uki_path   = os.environ["UKI_PATH"]
          rebuild_dir = os.environ["REBUILD_DIR"]

          pe = pefile.PE(uki_path)
          with open(uki_path, "rb") as f:
              raw = bytearray(f.read())

          for sec in pe.sections:
              name = sec.Name.decode().rstrip("\x00")
              if name == ".initrd":
                  with open(os.path.join(rebuild_dir, "initrd.img"), "wb") as f:
                      f.write(sec.get_data())
                  print(f"✅ Extracted .initrd ({len(sec.get_data())} bytes)")
              elif name == ".cmdline":
                  with open(os.path.join(rebuild_dir, "cmdline.txt"), "wb") as f:
                      f.write(sec.get_data().rstrip(b"\x00"))
                  print(f"✅ Extracted .cmdline: {sec.get_data().rstrip(b'\x00').decode(errors='replace')}")
              elif name == ".linux":
                  with open(os.path.join(rebuild_dir, "kernel.img"), "wb") as f:
                      f.write(sec.get_data())
                  print(f"✅ Extracted .linux kernel ({len(sec.get_data())} bytes)")

          # Build a minimal stub EFI from PE sections
          keep = {".text", ".rodata", ".data", ".reloc", ".sdmagic"}
          stub_sections = [s for s in pe.sections if s.Name.decode().rstrip("\x00") in keep]
          if not stub_sections:
              raise SystemExit("❌ No stub sections found in UKI")

          stub_end = max(s.PointerToRawData + s.SizeOfRawData for s in stub_sections)
          pe_off   = struct.unpack_from("<I", raw, 0x3C)[0]
          num_sec_off     = pe_off + 4 + 2
          opt_hdr_size    = struct.unpack_from("<H", raw, pe_off + 4 + 16)[0]
          sec_table_off   = pe_off + 4 + 20 + opt_hdr_size

          new_raw = bytearray(raw[:stub_end])
          struct.pack_into("<H", new_raw, num_sec_off, len(stub_sections))

          for i, s in enumerate(pe.sections):
              name = s.Name.decode().rstrip("\x00")
              if name not in keep:
                  entry_off = sec_table_off + (i * 40)
                  if entry_off + 40 <= len(new_raw):
                      new_raw[entry_off:entry_off+40] = b"\x00" * 40

          size_of_image_off = pe_off + 4 + 20 + 56
          new_size = ((stub_end + 0xFFF) & ~0xFFF)
          struct.pack_into("<I", new_raw, size_of_image_off, new_size)

          with open(os.path.join(rebuild_dir, "stub.efi"), "wb") as f:
              f.write(new_raw)
          print(f"✅ Stub EFI written ({len(new_raw)} bytes)")
          PYEOF

          # ── Step 4: Align kernel to 64K boundary ──────────────────────────
          # Use extracted kernel if present, otherwise fall back to build output
          if [ -f "$TMP_EFI/kernel.img" ]; then
            KERNEL_RAW="$TMP_EFI/kernel.img"
            echo "📌 Using kernel extracted from UKI"
          else
            KERNEL_RAW="$WORKSPACE/kobj/arch/arm64/boot/Image"
            echo "📌 Using kernel from build output"
          fi

          ALIGNED_IMAGE="$TMP_EFI/kernel.aligned"
          cp "$KERNEL_RAW" "$ALIGNED_IMAGE"

          IMAGE_SIZE=$(stat -c%s "$ALIGNED_IMAGE")
          ALIGNED_SIZE=$(( (IMAGE_SIZE + 65535) & ~65535 ))

          if [ "$IMAGE_SIZE" -ne "$ALIGNED_SIZE" ]; then
            echo "📐 Aligning kernel: $IMAGE_SIZE → $ALIGNED_SIZE bytes (padding $(( ALIGNED_SIZE - IMAGE_SIZE )) bytes)"
            truncate -s "$ALIGNED_SIZE" "$ALIGNED_IMAGE"
          else
            echo "📐 Kernel already aligned at $IMAGE_SIZE bytes"
          fi

          # Verify alignment
          FINAL_SIZE=$(stat -c%s "$ALIGNED_IMAGE")
          if (( FINAL_SIZE % 65536 != 0 )); then
            echo "❌ Kernel alignment verification failed: $FINAL_SIZE is not divisible by 65536"
            exit 1
          fi
          echo "✅ Kernel alignment verified: $FINAL_SIZE bytes ($(( FINAL_SIZE / 1024 )) KiB)"

          # ── Step 5: Patch cmdline — strip duplicates, add rootdelay=30 ────
          ORIG_CMD="$(cat "$TMP_EFI/cmdline.txt" | tr -d '\0' | xargs)"
          echo "📌 Original cmdline: $ORIG_CMD"

          # Remove any existing rootdelay= and rootwait entries to avoid duplicates
          CLEAN_CMD="$(echo "$ORIG_CMD" \
            | sed 's/rootdelay=[^ ]*//g' \
            | sed 's/rootwait//g' \
            | xargs)"
          NEW_CMD="$CLEAN_CMD rootdelay=30 rootwait"
          echo "📌 New cmdline:      $NEW_CMD"

          # ── Step 6: Rebuild UKI with ukify ────────────────────────────────
          python3 "$WORKSPACE/ukify.py" build \
            --linux        "$ALIGNED_IMAGE" \
            --initrd       "$TMP_EFI/initrd.img" \
            --cmdline      "$NEW_CMD" \
            --devicetree   "$DTB_SRC" \
            --stub         "$TMP_EFI/stub.efi" \
            --output       "$TMP_EFI/new_uki.efi"

          [ -f "$TMP_EFI/new_uki.efi" ] || { echo "❌ ukify failed to produce new_uki.efi"; exit 1; }
          echo "✅ New UKI built: $(ls -lh "$TMP_EFI/new_uki.efi" | awk '{print $5}')"

          # ── Step 7: Inject new UKI back into efi.bin using mtools ─────────
          # Remove old UKI then copy new one — no loop mount needed
          mdel  -i "$EFI_BIN" "::/EFI/Linux/$UKI_NAME" 2>/dev/null || true
          mcopy -i "$EFI_BIN" "$TMP_EFI/new_uki.efi" "::/EFI/Linux/$UKI_NAME"

          echo "✅ efi.bin patched successfully"
          ls -lh "$EFI_BIN"

          # Verify the UKI is readable back from the image
          echo "🔍 Verifying UKI inside efi.bin:"
          mdir -i "$EFI_BIN" ::/EFI/Linux/

      - name: Rebuild dtb.bin
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          DTB_BIN="$(find "$WORKSPACE/meta_dir/$MACHINE" -name "dtb.bin" | head -1)"
          DTB_SRC="$WORKSPACE/kobj/arch/arm64/boot/dts/qcom/${MACHINE}.dtb"

          [ -f "$DTB_BIN" ] || { echo "❌ dtb.bin not found"; exit 1; }
          [ -f "$DTB_SRC" ] || { echo "❌ DTB source not found: $DTB_SRC"; exit 1; }

          # Create a fresh FAT image and copy DTB as combined-dtb.dtb
          # UEFI searches for this fixed filename — do not use the machine name
          dd if=/dev/zero of="$WORKSPACE/new_dtb.bin" bs=1K count=4096 status=none
          mkfs.vfat "$WORKSPACE/new_dtb.bin" >/dev/null
          mcopy -i "$WORKSPACE/new_dtb.bin" "$DTB_SRC" :::combined-dtb.dtb

          # Verify
          echo "🔍 Verifying dtb.bin contents:"
          mdir -i "$WORKSPACE/new_dtb.bin"

          cp -fv "$WORKSPACE/new_dtb.bin" "$DTB_BIN"
          echo "✅ dtb.bin updated"
          ls -lh "$DTB_BIN"

      - name: Repack updated meta tar
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          META_TAR: ${{ matrix.meta_tar }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          META_DIR="$WORKSPACE/meta_dir/$MACHINE"
          OUTDIR="$WORKSPACE/output"
          mkdir -p "$OUTDIR"

          FINAL_TAR="$OUTDIR/$META_TAR"
          rm -f "$FINAL_TAR"

          tar -C "$META_DIR" -cf "$FINAL_TAR" .

          echo "✅ Repacked meta tar:"
          ls -lh "$FINAL_TAR"

      - name: Append artifacts to S3 upload list
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          META_TAR: ${{ matrix.meta_tar }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail

          mkdir -p "$WORKSPACE/artifacts"
          FILE_LIST="$WORKSPACE/artifacts/file_list.txt"
          : > "$FILE_LIST"

          FINAL_TAR="$WORKSPACE/output/$META_TAR"
          [ -f "$FINAL_TAR" ] || { echo "❌ Missing final meta tar: $FINAL_TAR"; exit 1; }

          echo "$FINAL_TAR" >> "$FILE_LIST"
          echo "✅ Queued for upload: $FINAL_TAR"
          cat "$FILE_LIST"

      - name: Upload updated meta to S3
        uses: qualcomm-linux/video-driver/.github/actions/aws_s3_helper@video.qclinuxmain.root
        with:
          s3_bucket: qli-prd-video-gh-artifacts
          local_file: ${{ github.workspace }}/artifacts/file_list.txt
          mode: multi-upload
          upload_location: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}

      - name: Clean up
        if: always()
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ws="$WORKSPACE"
          rm -rf "$ws/artifacts"   || true
          rm -rf "$ws/downloads"   || true
          rm -rf "$ws/kobj"        || true
          rm -rf "$ws/meta_dir"    || true
          rm -rf "$ws/output"      || true
          rm -rf "$ws/efi_rebuild" || true
          rm -f  "$ws/ukify.py"    || true
          rm -f  "$ws/new_dtb.bin" || true

      - name: Update summary
        if: success() || failure()
        shell: bash
        env:
          BUILD_STATUS: ${{ steps.build_workspace.outcome }}
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.machine }}
          META_TAR: ${{ matrix.meta_tar }}
        run: |
          set -euo pipefail

          if [ "$BUILD_STATUS" = "success" ]; then
            summary=":heavy_check_mark: Build Success"
          else
            summary=":x: Build Failed"
          fi

          {
            echo "<details><summary><i>Build Summary</i></summary>"
            echo "$summary"
            echo ""
            echo "- Machine: $MACHINE"
            echo "- Meta tar: $META_TAR"
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
