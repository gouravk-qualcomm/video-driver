name: post_merge_daily
description: |
  Runs post-merge CI for the video-driver repository on a daily schedule.
  Reuses loading, build and test workflows.

on:
  schedule:
    # Every day at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  loading:
    uses: qualcomm-linux/video-driver/.github/workflows/loading.yml@video.linux
    secrets: inherit

  build:
    needs: loading
    uses: qualcomm-linux/video-driver/.github/workflows/sync-and-build.yml@video.linux
    secrets: inherit
    with:
      docker_image: kmake-image:ver.1.0
      build_matrix: ${{ needs.loading.outputs.build_matrix }}

  lava-test:
    needs: [loading, build]
    uses: qualcomm-linux/video-driver/.github/workflows/test.yml@video.linux
    secrets: inherit
    with:
      docker_image: kmake-image:ver.1.0
      build_matrix: ${{ needs.loading.outputs.build_matrix }}
      full_matrix: ${{ needs.loading.outputs.full_matrix }}